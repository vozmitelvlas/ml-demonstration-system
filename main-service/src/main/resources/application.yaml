server:
  port: 8080
  error:
    include-stacktrace: never

spring:
  application:
    name: main-service

  datasource:
    driver-class-name: org.postgresql.Driver
    name: ${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${spring.datasource.name}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: true

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
    drop-first: false
