server:
  port: 8080
  error:
    include-stacktrace: never

spring:
  application:
    name: main-service

  servlet:
    multipart:
      location: "/tmp"
      max-request-size: 300MB
      max-file-size: 300MB

  task:
    scheduling:
      pool:
        size: 5

  datasource:
    driver-class-name: org.postgresql.Driver
    name: ${DB_NAME:db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${spring.datasource.name}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME:ml.demonstation.app@gmail.com}
    password: ${SMTP_PASSWORD:aygeqlihaupwwnfn}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: true

  sql:
    init:
      mode: always

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
    drop-first: true

jwt:
  secret-key: ${JWT_SECRET:example-of-secret-not-for-production-use}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

inference:
  monai-deploy:
    pacs:
      url: http://localhost:8042
      store-timeout-seconds: 20
      inference-task-timeout-seconds: 600 # 10 * 60
    result-storing-time-minutes: 5
