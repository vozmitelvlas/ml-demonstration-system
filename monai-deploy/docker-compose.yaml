services:
  minio:
    image: minio/minio:RELEASE.2024-06-11T03-13-30Z
    hostname: minio
    container_name: mdl-minio
    command: server --console-address ":9001" /data
    volumes:
      - $MINIO_DATA:/data
      - $MINIO_CONFIG:/root/.minio
    ports:
      - "9000" # Server port
      - "9001" # MinIO Console port
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    networks:
      - monaideploy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      start_period: 10s
      interval: 5s
      timeout: 30s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12.7-management
    hostname: rabbitmq
    container_name: mdl-rabbitmq
    environment:
      RABBITMQ_ERLANG_COOKIE: "SWQOKODSQALRPCLNMEQG"
      RABBITMQ_DEFAULT_USER: "admin"
      RABBITMQ_DEFAULT_PASS: "admin"
      RABBITMQ_DEFAULT_VHOST: "monaideploy"
    ports:
      - "5672"
      - "15672" # RabbitMQ management port
    volumes:
      - $RABBITMQ_DATA:/var/lib/rabbitmq/mnesia/
    networks:
      - monaideploy
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      start_period: 10s
      interval: 5s
      timeout: 30s
      retries: 5

  mongodb:
    image: mongo:5.0.25
    hostname: mongodb
    container_name: mdl-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    ports:
      - "27017"
    volumes:
      - $MONGODB_DATA:/data/db
    networks:
      - monaideploy
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo localhost:27017/productiondb --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  orthanc:
    image: orthancteam/orthanc:24.6.1-full
    hostname: orthanc
    container_name: mdl-orthanc
    volumes:
      - ./configs/orthanc.json:/etc/orthanc/orthanc.json
      - $ORTHANC_DATA:/var/lib/orthanc/db/
    ports:
      - "4242" # SCP port
      - "8042"  # UI port
    environment:
      VERBOSE_ENABLED: "true"
      DICOM_WEB_PLUGIN_ENABLED: "true"
      CONNECTIVITY_CHECKS_PLUGIN_ENABLED: "true"
    networks:
      - monaideploy
      - ml-demonstration-net
    healthcheck:
      test: [ "CMD", "/probes/test-aliveness.py" ]
      start_period: 10s
      retries: 5
      interval: 10s
      timeout: 30s

  informatics-gateway:
    image: ghcr.io/project-monai/monai-deploy-informatics-gateway:0.5.1-3
    hostname: informatics-gateway
    container_name: mdl-ig
    user: root:root
    volumes:
      - ./configs/informatics-gateway.json:/opt/monai/ig/appsettings.json
      - ./configs/nlog.config:/opt/monai/ig/nlog.config
      - $INFORMATICS_GATEWAY_PAYLOADS:/payloads
      - $INFORMATICS_GATEWAY_DATABASE:/database/
    environment:
      ASPNETCORE_URLS: http://+:5000
    # Informatics Gateway Ports - Changing the following values requires update to informatics-gateway.json
    ports:
      - "104"   # SCP Port
      - "5000" # REST API PORT
    networks:
      - monaideploy
    depends_on:
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    links:
      - minio
      - rabbitmq
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/health" ]
      start_period: 10s
      interval: 5s
      timeout: 30s
      retries: 10

  configure-ig:
    image: dwdraju/alpine-curl-jq:latest
    container_name: mdl-ig-cfg
    networks:
      - monaideploy
    volumes:
      - ./configs/config-ig.sh:/init.sh
    depends_on:
      informatics-gateway:
        condition: service_healthy
      orthanc:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - ./init.sh
      - informatics-gateway
      - "5000"
      - "MONAI-DEPLOY" # AE title
      - orthanc
      - "4242"
    links:
      - informatics-gateway

  workflow-manager:
    image: ghcr.io/project-monai/monai-deploy-workflow-manager:0.2.1-2
    hostname: workflow-manager
    container_name: mdl-wm
    volumes:
      - ./configs/workflow-manager.json:/opt/monai/wm/appsettings.json
    environment:
      ASPNETCORE_URLS: http://+:5001
    ports:
      - "5001"
    restart: unless-stopped
    networks:
      - monaideploy
      - ml-demonstration-net
    depends_on:
      informatics-gateway:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    links:
      - minio
      - rabbitmq
      - informatics-gateway
      - mongodb
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5001/health" ]
      start_period: 10s
      interval: 5s
      timeout: 30s
      retries: 10
  
  task-manager:
    image: ghcr.io/project-monai/monai-deploy-task-manager:0.2.1-2
    hostname: task-manager
    container_name: mdl-tm
    volumes:
      - ./configs/task-manager.json:/opt/monai/wm/appsettings.json
      - $TASK_MANAGER_DATA:/var/lib/mde/:rw
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      ASPNETCORE_URLS: http://+:5002
      HOST_TEMP_STORAGE: $TASK_MANAGER_DATA
    ports:
      - "5002" # REST API port
    restart: unless-stopped
    networks:
      - monaideploy
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    links:
      - minio
      - rabbitmq
      - mongodb
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5002/health" ]
      start_period: 10s
      interval: 5s
      timeout: 30s
      retries: 10

networks:
  monaideploy:
    name: monaideploy
    driver: bridge
  ml-demonstration-net:
    name: ml-demonstration-net
    external: true