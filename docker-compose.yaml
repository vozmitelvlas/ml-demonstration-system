services:
  frontend:
    container_name: frontend
    image: ml-demonstration-frontend
    build:
      context: frontend
      dockerfile: Dockerfile
    depends_on:
      - main-service
    ports:
      - "5173:8080"
    networks:
      - ml-demonstration-net

  main-service:
    container_name: main-service
    image: ml-demonstration-main-service
    build:
      context: main-service
      dockerfile: Dockerfile
    environment:
      DB_NAME: db
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      SMTP_USERNAME: ml.demonstation.app@gmail.com
    restart: on-failure
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - ml-demonstration-net

  db:
    image: postgres:16.3
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db
    restart: on-failure
    volumes:
      - app-data:/var/lib/postgresql/data
    networks:
        - ml-demonstration-net

  triton:
    image: nvcr.io/nvidia/tritonserver:24.12-py3
    container_name: triton_inference
    restart: always
    ports:
      - "8000:8000"  # HTTP API
      - "8001:8001"  # gRPC API
      - "8002:8002"  # Prometheus Metrics
    environment:
      - CUDA_VISIBLE_DEVICES=""  # Отключение GPU
      - OMP_NUM_THREADS=8
      - ONNXRUNTIME_THREADPOOL_SIZE=8
    volumes:
      - ./models:/models
    command: ["tritonserver", "--model-repository=/models/model_repository"]


volumes:
  app-data:

networks:
  ml-demonstration-net:
    name: ml-demonstration-net

