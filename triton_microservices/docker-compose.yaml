networks:
  ml-demonstration-net:
    external:
      name: ml-demonstration-net

services:

  python-wav2vec2:
    container_name: python-wav2vec2
    build: ../triton_microservices/python-wav2vec2
    ports:
      - "5000:5000"
    networks:
      - ml-demonstration-net

  python-unet:
    build: ../triton_microservices/python-unet
    container_name: python-unet
    ports:
      - "5100:5100"
    networks:
      - ml-demonstration-net

  python-tinyconv:
    build: ../triton_microservices/python-tinyconv
    container_name: python-tinyconv
    ports:
      - "5200:5200"
    networks:
      - ml-demonstration-net